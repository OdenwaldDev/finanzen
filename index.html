      p6: { name: "Kerwe Überschuss", typ: "einnahme", kasse: "abteilung", rhythmus: "jahr", betrag: 3500, start: M(10), kategorie: "Feste & Events", sicherheit: "unsicher", aktiv: true },
      p7: { name: "Mitgliedsbeiträge Förderverein", typ: "einnahme", kasse: "foerderverein", rhythmus: "jahr", betrag: 4600, start: M(3), kategorie: "Mitgliedsbeiträge", sicherheit: "fest", aktiv: true },
      p8: { name: "Zuschuss Jugend an die Abteilung", typ: "transfer", kasse: "foerderverein", an: "abteilung", rhythmus: "jahr", betrag: 3000, start: M(4), kategorie: "Sonstiges", sicherheit: "geplant", aktiv: true } },

  const listeners = {};

  const fire = c => setTimeout(() => (listeners[c] || []).forEach(f => f(snap(c))), 0);

  window.claude = { use: async n => ({ db, user, downloads })[n] || null };

<script>
// ---------- Grundlagen ----------
const KASSEN = [
  {id:"abteilung", name:"Abteilung Fußball", farbe:"var(--s1)"},
  {id:"foerderverein", name:"Förderverein", farbe:"var(--s2)"}
];
const RHYTHMEN = {monatlich:1, quartal:3, halbjahr:6, jahr:12, einmalig:0, plan:-1};
const RH_TXT = {monatlich:"monatlich", quartal:"vierteljährlich", halbjahr:"halbjährlich", jahr:"jährlich", einmalig:"einmalig", plan:"nach Plan"};
const KAT = {
  einnahme:["Mitgliedsbeiträge","Partner","Spieltag & Kasse","Feste & Events","Zuschüsse","Spenden","Eigenanteile","Sonstiges"],
  ausgabe:["Ausrüstung","Spielbetrieb & Verband","Schiedsrichter","Trainer & Übungsleiter","Platz & Anlage","Veranstaltungen","Versicherung & Gebühren","Sonstiges"]
};
const S = {kassen:{}, posten:[], buchungen:[], vorhaben:[], mode:"normal", tab:"uebersicht", horizon:24, preview:null, ready:false, dbOk:false, canWrite:true, me:null, names:{}};
let db = null, userCap = null, sampleCap = null, dlCap = null;

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = (v, d=0) => (v<=-Math.pow(10,-d)/2?"−":"") + Math.abs(v).toLocaleString("de-DE",{minimumFractionDigits:d, maximumFractionDigits:d}) + " €";
const eur2 = v => eur(v,2);
const ym = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
const addM = (m, n) => { const [y,mo] = m.split("-").map(Number); const d = new Date(y, mo-1+n, 1); return ym(d); };
const diffM = (a, b) => { const [ya,ma]=a.split("-").map(Number), [yb,mb]=b.split("-").map(Number); return (yb-ya)*12 + (mb-ma); };
const MON = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const mTxt = m => { const [y,mo]=m.split("-").map(Number); return MON[mo-1] + " " + String(y).slice(2); };
const mLong = m => { const [y,mo]=m.split("-").map(Number); return ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"][mo-1] + " " + y; };
const NOW = ym(new Date());
const kName = id => (KASSEN.find(k=>k.id===id)||{name:id}).name;

// ---------- Rechenkern ----------
// Liefert alle Zahlungen eines Postens im Zeitraum [from, to] als {monat, betrag, kasse}
function occurrences(p, from, to) {
  const out = [];
  const sign = p.typ === "einnahme" ? 1 : -1;
  const push = (m, b) => {
    if (m < from || m > to) return;
    if (p.typ === "transfer") {
      out.push({monat:m, betrag:-b, kasse:p.kasse, p});
      out.push({monat:m, betrag:b, kasse:p.an || "abteilung", p});
    } else out.push({monat:m, betrag:sign*b, kasse:p.kasse, p});
  };
  if (p.rhythmus === "plan") { (p.raten||[]).forEach(r => push(r.monat, Number(r.betrag)||0)); return out; }
  const step = RHYTHMEN[p.rhythmus] ?? 0;
  if (!p.start) return out;
  if (step === 0) { push(p.start, Number(p.betrag)||0); return out; }
  let m = p.start; let guard = 0;
  while (m <= to && guard++ < 600) { if (!p.ende || m <= p.ende) push(m, Number(p.betrag)||0); else break; m = addM(m, step); }
  return out;
}
const zaehlt = (p, mode) => mode === "vorsicht" ? !(p.sicherheit === "unsicher" && p.typ === "einnahme") : true;

// Ist-Stand je Kasse = Startsaldo + Buchungen ab Stichtag
function istStand(kid) {
  const k = S.kassen[kid] || {};
  const st = k.stichtag || "1900-01-01";
  return (Number(k.saldo)||0) + S.buchungen.filter(b => b.kasse===kid && b.datum >= st).reduce((s,b)=>s+(Number(b.betrag)||0),0);
}
// Wurde eine Fälligkeit im laufenden Monat schon gebucht?
function schonGebucht(p, m) { return S.buchungen.some(b => b.postenId === p.id && (b.datum||"").slice(0,7) === m); }

// Prognose: Monatsreihe je Kasse. extra = zusätzliche Einmalzahlungen [{monat,betrag,kasse}]
function forecast(opts={}) {
  const mode = opts.mode || S.mode, H = opts.horizon || S.horizon, extra = opts.extra || [];
  const from = NOW, to = addM(NOW, H-1);
  const months = Array.from({length:H}, (_,i)=>addM(NOW,i));
  const flows = {}; KASSEN.forEach(k => flows[k.id] = months.map(()=>({ein:0, aus:0, items:[]})));
  const add = (o) => { const i = diffM(from, o.monat); if (i<0||i>=H||!flows[o.kasse]) return; const f = flows[o.kasse][i];
    if (o.betrag>=0) f.ein += o.betrag; else f.aus += -o.betrag; f.items.push(o); };
  S.posten.filter(p => p.aktiv !== false && zaehlt(p, mode)).forEach(p => occurrences(p, from, to).forEach(o => { if (o.monat===NOW && schonGebucht(p, NOW)) return; add(o); }));
  S.vorhaben.filter(v => v.eingeplant && v.monat && v.id !== opts.exclude).forEach(v => {
    add({monat:v.monat, betrag:-(Number(v.betrag)||0), kasse:v.kasse, p:{name:v.titel, vorhaben:true}});
    if (Number(v.zuschuss) && !(mode==="vorsicht" && v.zuschussUnsicher)) add({monat:v.zuschussMonat||v.monat, betrag:Number(v.zuschuss), kasse:v.kasse, p:{name:"Zuschuss: "+v.titel, vorhaben:true}});
  });
  extra.forEach(add);
  const series = {};
  KASSEN.forEach(k => { let s = istStand(k.id); series[k.id] = flows[k.id].map(f => (s += f.ein - f.aus)); });
  const total = months.map((_,i)=>KASSEN.reduce((s,k)=>s+series[k.id][i],0));
  return {months, flows, series, total};
}
const reserve = kid => Number((S.kassen[kid]||{}).reserve)||0;

// Wann ist ein Vorhaben leistbar? Frühester Monat, ab dem die Kasse bis zum Horizontende über der Reserve bleibt.
function leistbarAb(v, mode) {
  const base = forecast({mode, horizon:S.horizon, exclude:v.id});
  const ser = base.series[v.kasse]; const r = reserve(v.kasse);
  const netto = (Number(v.betrag)||0) - (mode==="vorsicht" && v.zuschussUnsicher ? 0 : (Number(v.zuschuss)||0));
  for (let i=0;i<base.months.length;i++) { let ok = true; for (let j=i;j<ser.length;j++) if (ser[j]-netto < r) { ok=false; break; } if (ok) return base.months[i]; }
  return null;
}

// ---------- Daten ----------
const COLS = ["kassen","posten","buchungen","vorhaben"];
async function connect() {
  try { db = await window.claude?.use?.("db"); } catch(e) { db = null; }
  if (!db) { S.ready = true; S.dbOk = false; render(); return; }
  S.dbOk = true;
  try { userCap = await window.claude.use("user"); } catch(e) {}
  try { S.me = userCap ? await userCap.id() : null; } catch(e) {}
  try { const w = userCap ? await userCap.can("data.write") : null; if (w === false) S.canWrite = false; } catch(e) {}
  let pending = new Set(COLS);
  COLS.forEach(c => db.collection(c).onSnapshot(snap => {
    const rows = snap.docs.map(d => ({id:d.id, ...d.data()}));
    if (c === "kassen") { S.kassen = {}; rows.forEach(r => S.kassen[r.id] = r); } else S[c] = rows;
    pending.delete(c); if (!pending.size) S.ready = true;
    if (S.ready) scheduleRender();
  }, err => { if (err.code === "revoked") { S.canWrite = false; } scheduleRender(); }));
  setTimeout(() => { if (!S.ready) { S.ready = true; scheduleRender(); } }, 6000);
}
let rT = null; function scheduleRender() { clearTimeout(rT); rT = setTimeout(render, 30); }

async function save(col, id, data) {
  if (!db || !S.canWrite) { toast("Speichern ist hier nicht möglich."); return false; }
  const body = {...data, geaendert: new Date().toISOString(), von: S.me || null};
  delete body.id;
  try { if (id) await db.doc(col + "/" + id).set(body); else await db.collection(col).add(body); return true; }
  catch(e) { if (e.code === "invalid_argument") { S.canWrite = false; toast("Du hast hier nur Leserechte."); } else if (e.code === "quota_exceeded") toast("Speicher voll. Bitte alte Buchungen löschen."); else toast("Speichern hat nicht geklappt. Bitte nochmal."); return false; }
}
async function remove(col, id) {
  if (!db || !S.canWrite) return false;
  try { await db.doc(col + "/" + id).delete(); return true; } catch(e) { toast("Löschen hat nicht geklappt."); return false; }
}
async function nameOf(id) {
  if (!id || !userCap) return "";
  if (S.names[id] !== undefined) return S.names[id];
  try { const ps = await userCap.profiles([id]); S.names[id] = (ps[id] && ps[id].name) || ""; } catch(e) { S.names[id] = ""; }
  return S.names[id];
}
function toast(msg) {
  const t = document.createElement("div"); t.textContent = msg;
  t.style.cssText = "position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:20;font-size:14px;max-width:90vw";
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}

// ---------- Hinweise (regelbasiert, sofort) ----------
function hinweise(fc) {
  const out = [];
  KASSEN.forEach(k => {
    const ser = fc.series[k.id], r = reserve(k.id), ok = (S.kassen[k.id]||{}).bestaetigt;
    const minV = Math.min(...ser), iMin = ser.indexOf(minV);
    const under = fc.months.filter((m,i)=>ser[i] < r);
    if (!ok) { if (minV < 0) out.push({t:"warn", ic:"Puffer", h:`${k.name}: bis ${mLong(fc.months[iMin])} müssen ${eur(-minV)} vorhanden sein.`, s:"So viel geht vorübergehend mehr raus als reinkommt. Mit eingetragenem Kontostand siehst du, ob es reicht."}); return; }
    if (minV < 0) out.push({t:"bad", ic:"Achtung", h:`${k.name}: im ${mLong(fc.months[iMin])} im Minus (${eur(minV)}).`, s:"Zahlungen schieben, Zuschuss vom Förderverein einplanen oder Vorhaben später ansetzen."});
    else if (under.length) out.push({t:"warn", ic:"Reserve", h:`${k.name}: ${under.length} ${under.length===1?"Monat":"Monate"} unter der Reserve von ${eur(r)}, zuerst ${mLong(under[0])}.`, s:`Tiefster Stand ${eur(minV)} im ${mLong(fc.months[iMin])}.`});
    else out.push({t:"good", ic:"Stabil", h:`${k.name}: immer über der Reserve. Tiefster Stand ${eur(minV)} im ${mLong(fc.months[iMin])}.`, s:""});
  });
  // Förderverein kann helfen?
  const fv = fc.series.foerderverein, ab = fc.series.abteilung;
  const fvFrei = Math.min(...fv) - reserve("foerderverein");
  if ((S.kassen.foerderverein||{}).bestaetigt && Math.min(...ab) < reserve("abteilung") && fvFrei > 0) out.push({t:"warn", ic:"Tipp", h:`Der Förderverein hätte über den ganzen Zeitraum ${eur(fvFrei)} frei.`, s:"Ein Zuschuss an die Abteilung würde die Lücke schließen. Lege ihn unter Wiederkehrend als Zuschuss an."});
  // Kassenstand nicht gepflegt
  KASSEN.forEach(k => { const kk = S.kassen[k.id]; if (!kk || !kk.bestaetigt) out.unshift({t:"warn", ic:"Start", h:`Kontostand ${k.name} fehlt noch.`, s:"Trag den aktuellen Kontostand ein, sonst startet die Prognose bei 0 €.", act:"kasse:"+k.id}); });
  return out;
}

function monatsSchnitt(kid, typ, mode) {
  const fc = forecast({mode, horizon:12});
  const f = fc.flows[kid]; return f.reduce((s,x)=>s+(typ==="ein"?x.ein:x.aus),0)/12;
}

const fmtD = d => d ? d.split("-").reverse().join(".") : "";
function naechsteZahlungen(fc, n) {
  const all = []; KASSEN.forEach(k => fc.flows[k.id].forEach(f => f.items.forEach(o => { if (!(o.p.typ==="transfer" && o.betrag>0)) all.push(o); })));
  return all.sort((a,b)=> a.monat<b.monat?-1:a.monat>b.monat?1:Math.abs(b.betrag)-Math.abs(a.betrag)).slice(0,n);
}

// ---------- Diagramm (SVG, eine Achse) ----------
function chartSvg(fc, alt) {
  const W=CW(), H=W<500?260:300, L=64, R=16, T=16, B=34, n=fc.months.length;
  const vals = []; KASSEN.forEach(k => { vals.push(...fc.series[k.id], reserve(k.id)); if (alt) vals.push(...alt.series[k.id]); });
  let lo = Math.min(0, ...vals), hi = Math.max(...vals, 1);
  const step = niceStep((hi-lo)/4); lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step; if (hi===lo) hi = lo+step;
  const x = i => L + (n<=1?0:i*(W-L-R)/(n-1)), y = v => T + (hi-v)*(H-T-B)/(hi-lo);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kontostand-Prognose je Kasse für ${n} Monate">`;
  for (let v=lo; v<=hi+1e-6; v+=step) s += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?"var(--muted)":"var(--grid)"}" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${kurz(v)}</text>`;
  const every = Math.max(1, Math.ceil(n / Math.floor((W-L-R)/58)));
  fc.months.forEach((m,i)=>{ if (i%every===0) s += `<text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="12" fill="var(--muted)">${mTxt(m)}</text>`; });
  KASSEN.forEach(k => { const r = reserve(k.id); if (r>0) s += `<line x1="${L}" x2="${W-R}" y1="${y(r)}" y2="${y(r)}" stroke="${k.farbe}" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="2 4"/>`; });
  const path = ser => ser.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  KASSEN.forEach(k => {
    if (alt) s += `<path d="${path(alt.series[k.id])}" fill="none" stroke="${k.farbe}" stroke-width="2" stroke-dasharray="6 5"/>`;
    s += `<path d="${path(fc.series[k.id])}" fill="none" stroke="${k.farbe}" stroke-width="2.5" stroke-linejoin="round" ${alt?'stroke-opacity=".45"':""}/>`;
    const last = fc.series[k.id][n-1]; s += `<circle cx="${x(n-1)}" cy="${y(last)}" r="4" fill="${k.farbe}" stroke="var(--surface)" stroke-width="2"/>`;
  });
  s += `<line id="cx" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>`;
  s += `<rect id="hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/>`;
  return s + `</svg><div class="tip" id="tip" hidden></div>`;
}
function CW() { const v = document.getElementById('view'); const w = v ? v.clientWidth - 30 : 760; return Math.max(320, Math.min(760, Math.round(w))); }
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(raw,1)))); const f = raw/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function kurz(v) { const a = Math.abs(v); return (v<0?"−":"") + (a>=1000 ? (a/1000).toLocaleString("de-DE",{maximumFractionDigits:1})+" T€" : a+" €"); }
function wireChart(fc) {
  const box = $("#chart"); if (!box) return; const svg = $("svg", box), hit = $("#hit", box), tip = $("#tip", box), cx = $("#cx", box);
  const n = fc.months.length, W=CW(), L=64, R=16;
  const show = ev => {
    const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(n-1, Math.round((px-L)/((W-L-R)/(n-1||1)))));
    const xx = L + i*(W-L-R)/(n-1||1);
    cx.setAttribute("x1", xx); cx.setAttribute("x2", xx); cx.setAttribute("visibility","visible");
    const rows = KASSEN.map(k => { const f = fc.flows[k.id][i]; return `<div><span class="dot" style="background:${k.farbe}"></span>${esc(k.name.split(" ")[0])}: <b>${eur(fc.series[k.id][i])}</b><br><span style="opacity:.75">+${eur(f.ein)} / −${eur(f.aus)}</span></div>`; }).join("");
    tip.innerHTML = `<b>${mLong(fc.months[i])}</b>${rows}`; tip.hidden = false;
    tip.style.left = Math.min(Math.max((xx/W)*r.width, 95), r.width-95) + "px"; tip.style.top = "40px";
  };
  hit.addEventListener("pointermove", show); hit.addEventListener("pointerdown", show);
  hit.addEventListener("pointerleave", () => { tip.hidden = true; cx.setAttribute("visibility","hidden"); });
}

// ---------- Wiederkehrend ----------
function postenBetragTxt(p) {
  if (p.rhythmus === "plan") { const sum = (p.raten||[]).reduce((s,r)=>s+(Number(r.betrag)||0),0); return eur(sum) + " in " + (p.raten||[]).length + " Raten"; }
  return eur(Number(p.betrag)||0, (Number(p.betrag)%1)?2:0) + " " + RH_TXT[p.rhythmus];
}
function proJahr(p) {
  const y0 = NOW, y1 = addM(NOW, 11);
  return occurrences(p, y0, y1).filter(o => o.kasse === p.kasse).reduce((s,o)=>s+o.betrag,0);
}
function viewPosten() {
  let h = `<div class="row" style="margin-bottom:10px"><p class="small" style="margin:0;flex:1;min-width:220px">Einmal anlegen, die Prognose rechnet alles automatisch fort. Zuschüsse vom Förderverein an die Abteilung als „Zuschuss“ anlegen.</p>
    ${S.canWrite && S.dbOk ? `<button class="primary" data-act="neu-posten">+ Neuer Posten</button>` : ""}</div>`;
  KASSEN.forEach(k => {
    const ps = S.posten.filter(p => p.kasse === k.id);
    const typen = [["einnahme","Einnahmen"],["ausgabe","Ausgaben"],["transfer","Zuschüsse an andere Kasse"]];
    h += `<div class="card" style="margin-bottom:12px"><h2><span class="dot" style="background:${k.farbe}"></span>${esc(k.name)}</h2>`;
    let any = false;
    typen.forEach(([t, titel]) => {
      const list = ps.filter(p => p.typ === t).sort((a,b)=>Math.abs(proJahr(b))-Math.abs(proJahr(a)));
      if (!list.length) return; any = true;
      const summe = list.reduce((s,p)=>s+proJahr(p),0);
      h += `<div class="row" style="margin-top:10px"><h3>${titel}</h3><span class="sp"></span><span class="small">nächste 12 Monate: <b class="${summe>=0?"pos":"neg"}">${eur(summe)}</b></span></div><div class="list">`;
      list.forEach(p => {
        const j = proJahr(p);
        h += `<div class="item" data-edit="${p.id}"><span class="n">${esc(p.name)}${p.sicherheit==="unsicher"?`<span class="tag unsicher">unsicher</span>`:p.sicherheit==="geplant"?`<span class="tag geplant">geplant</span>`:""}${p.aktiv===false?`<span class="tag">pausiert</span>`:""}</span>
          <span class="a ${p.typ==="einnahme"?"pos":""}">${p.typ==="einnahme"?"+":"−"}${p.rhythmus==="plan"?eur(Math.abs((p.raten||[]).reduce((s,r)=>s+(Number(r.betrag)||0),0))):eur(Math.abs(Number(p.betrag)||0),(Number(p.betrag)%1)?2:0)}</span>
          <span class="m">${esc(postenBetragTxt(p))} · ${esc(p.kategorie||"")}${p.typ==="transfer"?" an "+esc(kName(p.an)):""}${j?` · ${eur(Math.abs(j))} in 12 Mon.`:""}${p.notiz?` · ${esc(p.notiz)}`:""}</span></div>`;
      });
      h += `</div>`;
    });
    if (!any) h += `<div class="empty">Noch keine Posten. Typisch sind Mitgliedsbeiträge, Partnerbeiträge, Verbandsgebühren, Schiedsrichter und Platzkosten.</div>`;
    h += `</div>`;
  });
  return h;
}

// --- CSV lesen (Sparkasse CSV-CAMT und ähnliche) ---
function parseCSV(text) {
  text = text.replace(/^﻿/, "");
  const first = text.split(/\r?\n/)[0] || ""; const d = (first.match(/;/g)||[]).length >= (first.match(/,/g)||[]).length ? ";" : ",";
  const rows = []; let row = [], cur = "", q = false;
  for (let i=0;i<text.length;i++) { const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === d) { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c; }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function toISO(s) { s = (s||"").trim(); let m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/); if (m) { let y = m[3].length===2 ? "20"+m[3] : m[3]; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; } m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[0] : null; }
function readImport(text, kasse) {
  const rows = parseCSV(text); if (rows.length < 2) throw new Error("leer");
  const hd = rows[0].map(h => h.toLowerCase().replace(/[^a-zäöüß]/g,""));
  const find = (...keys) => { for (const k of keys) { const i = hd.indexOf(k); if (i >= 0) return i; } return hd.findIndex(h => keys.some(k => h.includes(k)) && !h.includes("ursprung") && !h.includes("valuta")); };
  const iD = find("buchungstag","buchungsdatum","datum"), iB = find("betrag","umsatz"), iZ = find("verwendungszweck","zweck"), iN = find("beguenstigter","begünstigter","zahlungspflichtiger","name","empfänger","auftraggeber"), iT = find("buchungstext");
  if (iD < 0 || iB < 0) throw new Error("spalten");
  const seen = new Set(S.buchungen.map(b => b.hash));
  return rows.slice(1).map(r => {
    const datum = toISO(r[iD]); const betrag = parseNum(r[iB]); if (!datum || !betrag) return null;
    const name = iN>=0 ? r[iN].trim() : ""; const zweck = iZ>=0 ? r[iZ].trim() : ""; const bt = iT>=0 ? r[iT].trim() : "";
    const text = [name, zweck || bt].filter(Boolean).join(" · ").slice(0,160);
    const hash = (datum + "|" + betrag.toFixed(2) + "|" + text.toLowerCase().replace(/\s+/g," ").slice(0,60)).replace(/[^a-z0-9|.\-äöüß ]/g,"");
    const o = {datum, betrag, text, name, kasse, hash, dup: seen.has(hash)};
    zuordnen(o); return o;
  }).filter(Boolean);
}
function zuordnen(o) {
  const t = o.text.toLowerCase();
  const p = S.posten.find(p => (p.kasse===o.kasse || p.an===o.kasse) && ((p.stichwort && p.stichwort.split(",").some(w => w.trim() && t.includes(w.trim().toLowerCase()))) || (p.name && t.includes(p.name.toLowerCase().split(" ")[0]) && p.name.length>3) || (p.rhythmus!=="plan" && Math.abs(Math.abs(o.betrag) - (Number(p.betrag)||0)) < 0.01 && Math.sign(o.betrag) === (p.typ==="einnahme"?1:-1))));
  if (p) { o.postenId = p.id; o.kategorie = p.kategorie; return; }
  const rules = [[/partner|sponsor|werbung|bande|trikot.*brust/,"Partner"],[/mitglied|vereinsbeitrag|jahresbeitrag/,"Mitgliedsbeiträge"],[/hfv|dfb|verband|kreis.*fußball|spielbetrieb/,"Spielbetrieb & Verband"],[/schiri|schiedsrichter/,"Schiedsrichter"],[/11teamsports|eleven|adidas|jako|trikot|sport/,"Ausrüstung"],[/gemeinde|strom|wasser|platz|rasen/,"Platz & Anlage"],[/versicherung|arag|gebühr|entgelt|kontoführung/,"Versicherung & Gebühren"],[/spende/,"Spenden"],[/zuschuss|förder|lsb|landessportbund/,"Zuschüsse"],[/kerwe|fest|getränk|brauerei/,"Feste & Events"]];
  const hit = rules.find(([re]) => re.test(t)); o.kategorie = hit ? hit[1] : "Sonstiges";
  if (o.betrag>=0 && !KAT.einnahme.includes(o.kategorie)) o.kategorie = "Sonstiges";
  if (o.betrag<0 && !KAT.ausgabe.includes(o.kategorie)) o.kategorie = "Sonstiges";
}

// --- Wiederkehrendes erkennen ---
function vorschlaege() {
  const g = {};
  S.buchungen.filter(b => !b.postenId && b.name).forEach(b => { const k = b.kasse + "|" + b.name.toLowerCase().slice(0,28) + "|" + Math.sign(b.betrag); (g[k] = g[k] || []).push(b); });
  const out = [];
  Object.values(g).forEach(list => { if (list.length < 3) return;
    const bs = list.map(b=>Math.abs(b.betrag)).sort((a,b)=>a-b), med = bs[Math.floor(bs.length/2)];
    if (bs.some(x => Math.abs(x-med) > med*0.15)) return;
    const ds = list.map(b=>new Date(b.datum)).sort((a,b)=>a-b); const gaps = ds.slice(1).map((d,i)=>(d-ds[i])/864e5).sort((a,b)=>a-b); const gm = gaps[Math.floor(gaps.length/2)];
    const rhythmus = gm < 45 ? "monatlich" : gm < 120 ? "quartal" : gm < 240 ? "halbjahr" : "jahr";
    const s = Math.sign(list[0].betrag);
    if (S.posten.some(p => p.name.toLowerCase() === list[0].name.toLowerCase())) return;
    out.push({name:list[0].name, betrag:s*med, rhythmus, kasse:list[0].kasse, n:list.length, kategorie:list[0].kategorie, letzte:ds[ds.length-1]});
  });
  return out.slice(0,8);
}

function zusammenfassung() {

  const k = KASSEN.map(x => ({kasse:x.name, heute:Math.round(istStand(x.id)), reserve:reserve(x.id), kontostandGepflegt:!!(S.kassen[x.id]||{}).bestaetigt,

  const posten = S.posten.map(p => ({name:p.name, kasse:kName(p.kasse), typ:p.typ, an:p.an?kName(p.an):undefined, rhythmus:RH_TXT[p.rhythmus], betrag:p.rhythmus==="plan"?undefined:p.betrag, raten:p.rhythmus==="plan"?p.raten:undefined, start:p.start, ende:p.ende||undefined, kategorie:p.kategorie, sicherheit:p.sicherheit, notiz:p.notiz||undefined, aktiv:p.aktiv!==false}));
  const vorhaben = S.vorhaben.map(v => ({titel:v.titel, kasse:kName(v.kasse), kosten:v.betrag, zuschuss:v.zuschuss||0, zuschussUnsicher:!!v.zuschussUnsicher, prio:v.prio, wunschmonat:v.monat, eingeplant:!!v.eingeplant, machbarAb:leistbarAb(v,"normal"), machbarAbVorsichtig:leistbarAb(v,"vorsicht")}));
  const monate = fc.months.slice(0,12).map((m,i)=>({monat:m, ...Object.fromEntries(KASSEN.map(x=>[x.id, {ein:Math.round(fc.flows[x.id][i].ein), aus:Math.round(fc.flows[x.id][i].aus), stand:Math.round(fc.series[x.id][i])}]))}));
  return {heute:NOW, kassen:k, posten, vorhaben, naechste12Monate:monate, anzahlBuchungen:S.buchungen.length};
}
async function frageStellen(frage) {
  if (!sampleCap || RAT.laeuft) return;
  RAT = {frage, antwort:"", laeuft:true, ctl:new AbortController()}; render();
  const anweisung = `Du bist der Finanzberater der Fußballabteilung des SV/BSC Mörlenbach (Sportverein Mörlenbach 1896 e.V., gemeinnützig) und ihres Fördervereins. Die drei Leute, die fragen, sind Albert (Abteilungsleitung), Tobias (Finanzen) und Lukas (Organisation).
Regeln für deine Antwort:
- Deutsch, du-Form, freundlich und direkt. Kurz: höchstens 12 Zeilen, dann Schluss.
- Rechne mit den Zahlen unten und nenne konkrete Beträge und Monate. Erfinde keine Zahlen; wenn etwas fehlt, sag welche Angabe fehlt.
- Schreib "Partner", nie "Sponsor". Keine Gedankenstriche, keine Emojis, kein Markdown außer einfachen Aufzählungen mit "- ".
- Denk an das Gemeinnützigkeitsrecht: zeitnahe Mittelverwendung, Rücklagen nur zweckgebunden oder als freie Rücklage nach § 62 AO, Mittelweitergabe Förderverein an Hauptverein nach § 58 AO. Nenn das nur, wenn es zur Frage passt.
- Bei Förderprogrammen: nenn typische Quellen für hessische Sportvereine (Landessportbund Hessen, Sportkreis Bergstraße, Kreis Bergstraße, Gemeinde Mörlenbach, Stiftungen der Sparkasse Starkenburg, DFB Ehrenamt und Vereinsförderung), aber sag, dass Bedingungen und Fristen vorher geprüft werden müssen.
- Schließ mit einer klaren Empfehlung, was als Nächstes zu tun ist.
- Du ersetzt keine Steuer- oder Rechtsberatung; sag das nur in einem kurzen Satz, wenn es um Steuern oder Recht geht.

Daten (JSON, Beträge in Euro, Monate als JJJJ-MM):
${JSON.stringify(zusammenfassung())}

Frage: ${frage}`;
  try {
    await sampleCap(anweisung, {signal:RAT.ctl.signal, cache:false, modelTier:"default", onText:({text}) => { RAT.antwort = text; const el = $("#ans"); if (el) el.textContent = text; }});
  } catch(e) {
    if (e && e.code === "not_granted") { sampleCap = null; RAT.antwort = ""; toast("Der Ratgeber wurde nicht freigegeben."); }
    else if (e && e.code === "rate_limited") RAT.antwort = (RAT.antwort||"") + "\n\nGerade zu viele Fragen. Bitte in einer Minute nochmal.";
    else if (!(e && e.name === "AbortError")) RAT.antwort = (e && e.text) || RAT.antwort || "Das hat nicht geklappt. Bitte nochmal fragen.";
  }
  RAT.laeuft = false; render();
}
function viewRat() {
  if (!sampleCap) return `<div class="card empty">Der Ratgeber ist in dieser Ansicht nicht verfügbar. Alles andere funktioniert normal.</div>`;
  return `<div class="card"><h2>Frag den Ratgeber</h2><p class="small" style="margin-top:0">Er kennt eure Kassen, Posten und Vorhaben und rechnet mit euren Zahlen. Er ersetzt keine Steuer- oder Rechtsberatung.</p>
    <div class="row" style="margin-bottom:10px">${FRAGEN.map((f,i)=>`<button class="chip" data-frage="${i}" ${RAT.laeuft?"disabled":""}>${esc(f)}</button>`).join("")}</div>
    <form id="ratForm" class="row"><input id="ratIn" placeholder="Eigene Frage, z.B. Können wir uns im Frühjahr neue Jugendtore leisten?" style="flex:1;min-width:200px"><button class="primary" ${RAT.laeuft?"disabled":""}>Fragen</button></form>
    ${RAT.frage?`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px"><div class="lbl">Frage</div><p style="margin:2px 0 10px;color:var(--ink)">${esc(RAT.frage)}</p><div class="lbl">Antwort</div><div class="answer" id="ans">${esc(RAT.antwort || (RAT.laeuft?"Rechne nach …":""))}</div>${RAT.laeuft?`<button class="ghost" data-act="rat-stop">Abbrechen</button>`:""}</div>`:""}
  </div>`;
}

// ---------- Darstellung & Bedienung ----------
function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === S.tab));
  document.querySelectorAll("#modeSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === S.mode));
  const bn = [];
  if (!S.dbOk && S.ready) bn.push("Vorschau mit Beispieldaten. Gespeichert wird nur in der geteilten Ansicht auf claude.ai.");
  else if (!S.canWrite) bn.push("Du kannst hier nur lesen.");
  if (S.mode === "vorsicht") bn.push("Vorsichtig: unsichere Einnahmen und unsichere Zuschüsse sind herausgerechnet.");
  $("#banner").innerHTML = bn.map(t=>`<div class="banner">${esc(t)}</div>`).join("");
  if (!S.ready) { $("#view").innerHTML = `<div class="card empty">Lade Daten …</div>`; return; }
  const v = {uebersicht:viewUebersicht, posten:viewPosten, vorhaben:viewVorhaben, buchungen:viewBuchungen, rat:viewRat}[S.tab];
  const y = window.scrollY; $("#view").innerHTML = v(); window.scrollTo(0, y);
  if (S.tab === "uebersicht") wireChart(S.preview ? forecast({extra:S.preview.extra}) : forecast());
  if (S.tab === "buchungen") wireImport();
}
function wireImport() {
  const inp = $("#csv"), drop = $("#drop"); if (!inp) return;
  const go = async f => { if (!f) return; try { const txt = await readText(f); IMP = {kasse:($('#impK [aria-pressed="true"]')||{}).dataset?.k || "abteilung"}; IMP.rows = readImport(txt, IMP.kasse); if (!IMP.rows.length) { IMP = null; toast("Keine Buchungen in der Datei gefunden."); } render(); }
    catch(e) { IMP = null; toast(e.message === "spalten" ? "Spalten Datum und Betrag nicht gefunden. Ist es der CSV-CAMT-Export?" : "Datei konnte nicht gelesen werden."); render(); } };
  inp.onchange = () => go(inp.files[0]);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); }; drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); go(e.dataTransfer.files[0]); };
}
async function readText(f) { const buf = await f.arrayBuffer(); let t = new TextDecoder("utf-8").decode(buf); if (t.includes(String.fromCharCode(0xFFFD))) t = new TextDecoder("windows-1252").decode(buf); return t; }

document.addEventListener("click", async e => {
  const t = e.target.closest("button,[data-edit],[data-act]"); if (!t) return;
  if (t.closest("#tabs")) { S.tab = t.dataset.tab; render(); return; }
  if (t.closest("#modeSeg")) { S.mode = t.dataset.mode; render(); return; }
  if (t.closest("#impK")) { const k = t.dataset.k; t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b===t)); if (IMP) { IMP.kasse = k; IMP.rows.forEach(r=>{r.kasse=k; zuordnen(r);}); render(); } return; }
  const d = t.dataset;
  if (d.h) { S.horizon = Number(d.h); render(); return; }
  if (d.frage) { frageStellen(FRAGEN[Number(d.frage)]); return; }
  if (d.prev) { previewVorhaben(S.vorhaben.find(v=>v.id===d.prev)); return; }
  if (d.vedit) { sheetVorhaben(S.vorhaben.find(v=>v.id===d.vedit)); return; }
  if (d.plan) { const v = S.vorhaben.find(x=>x.id===d.plan); const an = !v.eingeplant; const monat = v.monat || leistbarAb(v,S.mode) || NOW; await save("vorhaben", v.id, {...v, eingeplant:an, monat}); if (an) toast(`Eingeplant für ${mLong(monat)}.`); return; }
  if (d.vor) { await vorschlagUebernehmen(vorschlaege()[Number(d.vor)]); return; }
  if (d.edit !== undefined) { const p = S.posten.find(p=>p.id===d.edit); if (p && S.canWrite && S.dbOk) sheetPosten(p); return; }
  const a = d.act || "";
  if (a.startsWith("kasse:")) { if (S.canWrite && S.dbOk) sheetKasse(a.slice(6)); return; }
  if (a === "neu-posten") sheetPosten(null);
  else if (a === "neu-vorhaben") sheetVorhaben(null);
  else if (a === "endpreview") { S.preview = null; render(); }
  else if (a === "imp-abbruch") { IMP = null; render(); }
  else if (a === "imp-ok") importieren();
  else if (a === "export") exportCSV();
  else if (a === "rat-stop") { RAT.ctl && RAT.ctl.abort(); }
});
document.addEventListener("change", e => { const s = e.target.closest("select[data-ri]"); if (!s || !IMP) return; const r = IMP.rows[Number(s.dataset.ri)]; const [k,v] = [s.value.slice(0,1), s.value.slice(2)];
  if (k === "p") { const p = S.posten.find(x=>x.id===v); r.postenId = v; r.kategorie = p ? p.kategorie : r.kategorie; } else { r.postenId = null; r.kategorie = v; } });
document.addEventListener("submit", e => { if (e.target.id !== "ratForm") return; e.preventDefault(); const q = $("#ratIn").value.trim(); if (q) frageStellen(q); });

// ---------- Beispieldaten nur für die Vorschau ohne Speicher ----------
function demo() {
  S.kassen = {abteilung:{saldo:12000, stichtag:NOW+"-01", reserve:5000, bestaetigt:true}, foerderverein:{saldo:8000, stichtag:NOW+"-01", reserve:2000, bestaetigt:true}};
  S.posten = [
    {id:"d1", name:"Beispiel: Partnerbeiträge", typ:"einnahme", kasse:"abteilung", rhythmus:"jahr", betrag:6000, start:addM(NOW,2), kategorie:"Partner", sicherheit:"geplant"},
    {id:"d2", name:"Beispiel: Verbandsgebühren", typ:"ausgabe", kasse:"abteilung", rhythmus:"halbjahr", betrag:1400, start:addM(NOW,1), kategorie:"Spielbetrieb & Verband", sicherheit:"fest"},
    {id:"d3", name:"Beispiel: Schiedsrichter", typ:"ausgabe", kasse:"abteilung", rhythmus:"monatlich", betrag:350, start:NOW, kategorie:"Schiedsrichter", sicherheit:"fest"},
    {id:"d4", name:"Beispiel: Mitgliedsbeiträge Förderverein", typ:"einnahme", kasse:"foerderverein", rhythmus:"jahr", betrag:4200, start:addM(NOW,3), kategorie:"Mitgliedsbeiträge", sicherheit:"fest"},
    {id:"d5", name:"Beispiel: Zuschuss Jugend", typ:"transfer", kasse:"foerderverein", an:"abteilung", rhythmus:"jahr", betrag:2500, start:addM(NOW,4), kategorie:"Sonstiges", sicherheit:"geplant"}];
  S.vorhaben = [{id:"v1", titel:"Beispiel: Ballwand", betrag:9000, zuschuss:3000, zuschussUnsicher:true, kasse:"abteilung", prio:1, monat:addM(NOW,6)}];
}

(async function init() {
  render();
  const use = n => (window.claude && window.claude.use ? window.claude.use(n).catch(()=>null) : Promise.resolve(null));
  use("sample").then(x => { sampleCap = x; if (S.tab === "rat") render(); });
  use("downloads").then(x => { dlCap = x; if (S.tab === "buchungen") render(); });
  await connect();
  if (!S.dbOk) { demo(); render(); }
})();
let rzT=null; window.addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => { if (S.tab === "uebersicht") render(); }, 200); });

</script>
